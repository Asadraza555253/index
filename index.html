html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Arial,Helvetica,sans-serif}
header{background:var(--hd);color:#fff;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:20px}header small{opacity:.8}
button,label.b{background:#fff;color:#1f3a68;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px}
main{padding:16px 20px;max-width:1200px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.k,.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px}
.k b{display:block;font-size:24px}.k span{color:var(--mut);font-size:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.c h2{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}.dl{background:var(--hd);color:#fff;padding:5px 10px;font-size:12px}.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;text-align:center}th,td{border:1px solid var(--ln);padding:5px 8px;white-space:nowrap}
th{background:var(--card);color:var(--tx);font-weight:700}td.l{background:var(--blue);text-align:left}td.r{background:var(--grey);font-weight:700}
tr.t td{background:var(--grey);font-weight:700}tr.p td{background:var(--green);font-weight:700}
.bar{position:relative;text-align:right;min-width:70px}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);z-index:0}.bar s{position:relative;text-decoration:none;font-weight:700}
.red{color:var(--red);font-weight:700}
ul{margin:0;padding-left:18px}li{margin:4px 0}.full{grid-column:1/-1}
#msg{font-size:12px;color:#fff;opacity:.9}
</style></head><body>
